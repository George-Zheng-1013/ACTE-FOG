seed: 20260916
data:
  sensor_csv: data/sensor_data.csv
  clinical_csv: data/clinical_data.csv
  fs: 60
  filter_low: 0.5
  filter_high: 20.0
  window_seconds: 2.0
  overlap: 0.75
  label_rule: majority
  sensor_set: [ankleL, ankleR, back, wrist]
  include_missing_mask: true
split:
  mode: matched_11_5_6
  train_n: 11
  val_n: 5
  test_n: 6
model:
  name: ms_coord_net
  hidden: 48
  dropout: 0.25
  graph_heads: 4
  aux_activity_weight: 0.20
  transition_weight: 0.10
train:
  epochs: 100
  batch_size: 128
  lr: 0.001
  weight_decay: 0.0005
  patience: 15
  monitor: val_auc
  class_weight: auto
